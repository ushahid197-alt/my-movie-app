<script>
    async function loadMovies() {
        const container = document.getElementById('movieGrid'); // Ya jo bhi aapka main grid container ID hai
        try {
            const res = await fetch('/api/movies');
            const data = await res.json();

            if (data.success && data.items && data.items.length > 0) {
                container.innerHTML = data.items.map(movie => `
                    <div class="movie-card" onclick="playMovie('${movie.id}')">
                        <img src="${movie.poster}" alt="${movie.title}">
                        <h3>${movie.title}</h3>
                    </div>
                `).join('');
            } else {
                container.innerHTML = '<p>No movies found.</p>';
            }
        } catch (err) {
            console.error('Error fetching movies:', err);
            container.innerHTML = '<p>Error loading movies from server.</p>';
        }
    }

    loadMovies();
</script>
