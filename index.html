<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Movie App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 240px;
            background-color: #1e293b;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid #334155;
        }

        .brand {
            font-size: 1.2rem;
            font-weight: bold;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menu-item {
            background-color: #334155;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            color: #f8fafc;
        }

        /* Main Area */
        .main-content {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }

        .header-title {
            font-size: 1.4rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Movie Grid */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background-color: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }

        .movie-card img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            background-color: #334155;
        }

        .movie-card h3 {
            font-size: 0.85rem;
            padding: 10px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #e2e8f0;
        }

        .loading-text {
            color: #94a3b8;
            font-size: 1rem;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="brand">▶ MY MOVIE APP</div>
        <div class="menu-item">🏠 Latest Movies</div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <h2 class="header-title">🔥 Latest Releases</h2>
        
        <div id="movieGrid" class="movie-grid">
            <p class="loading-text">Loading content from server...</p>
        </div>
    </div>

    <script>
        async function fetchMovies() {
            const grid = document.getElementById('movieGrid');
            try {
                const response = await fetch('/api/movies');
                const data = await response.json();

                if (data.success && data.items && data.items.length > 0) {
                    grid.innerHTML = data.items.map(movie => `
                        <div class="movie-card">
                            <img src="${movie.poster}" alt="${movie.title}" onerror="this.src='https://via.placeholder.com/160x230?text=No+Poster'">
                            <h3>${movie.title}</h3>
                        </div>
                    `).join('');
                } else {
                    grid.innerHTML = '<p class="loading-text">No movies found at the moment.</p>';
                }
            } catch (error) {
                console.error('Error loading movies:', error);
                grid.innerHTML = '<p class="loading-text">Failed to load content from server.</p>';
            }
        }

        fetchMovies();
    </script>
</body>
</html>
